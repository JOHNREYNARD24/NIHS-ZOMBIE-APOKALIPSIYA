<!DOCTYPE html>
<html lang="ceb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NIHS ZOMBIE APOCALYPSE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  touch-action:none;
}

button{
  font-family:inherit;
  cursor:pointer;
}

.screen{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
}

.screen.active{
  display:flex;
}

.hidden{
  display:none!important;
}

/* =========================================================
   INTRO
========================================================= */

#intro{
  background:#000;
  z-index:1000;
  flex-direction:column;
  text-align:center;
  padding:20px;
}

.introItem{
  opacity:0;
  transition:opacity 1.2s ease;
  max-width:900px;
}

.introItem.show{
  opacity:1;
}

.introLogo{
  width:min(230px,55vw);
  aspect-ratio:1;
  object-fit:contain;
  border-radius:50%;
  filter:drop-shadow(0 0 25px #7b2cff);
}

.introTitle{
  font-size:clamp(24px,6vw,60px);
  font-weight:900;
  color:#b875ff;
  text-shadow:0 0 15px #6d1cff;
  line-height:1.15;
}

.introDeveloper{
  font-size:clamp(20px,5vw,42px);
  line-height:1.4;
  font-weight:bold;
}

.introWarning{
  color:#ff4444;
  font-size:clamp(18px,4vw,34px);
  font-weight:900;
  line-height:1.35;
  text-shadow:0 0 10px #900;
}

.logoBlood{
  position:relative;
}

.logoBlood::after{
  content:"";
  position:absolute;
  inset:10% 25% 0;
  background:linear-gradient(#ff1c1c,#690000);
  opacity:.45;
  clip-path:polygon(
    30% 0,
    38% 30%,
    48% 12%,
    55% 45%,
    67% 18%,
    72% 100%,
    25% 100%
  );
  pointer-events:none;
}

.logoName{
  margin-top:15px;
  font-weight:900;
  font-size:clamp(22px,5vw,45px);
  color:#fff;
  text-shadow:0 0 12px #8d25ff;
}

/* =========================================================
   PANELS
========================================================= */

.mainPanel{
  width:min(850px,92vw);
  max-height:92vh;
  overflow:auto;
  padding:30px;
  border:2px solid #8f35ff;
  border-radius:25px;
  background:
    linear-gradient(
      145deg,
      rgba(20,8,35,.96),
      rgba(49,13,77,.96)
    );
  box-shadow:0 0 40px rgba(132,35,255,.35);
  text-align:center;
}

.logo{
  width:min(190px,42vw);
  border-radius:50%;
  margin-bottom:15px;
  filter:drop-shadow(0 0 18px #7629ff);
}

h1{
  color:#c58cff;
  font-size:clamp(28px,6vw,55px);
  margin-bottom:12px;
}

h2{
  margin-bottom:20px;
  color:#e0c7ff;
}

.btn{
  width:min(430px,90%);
  margin:8px auto;
  display:block;
  padding:15px 20px;
  border:2px solid #a94cff;
  border-radius:14px;
  color:white;
  background:linear-gradient(135deg,#4a1680,#791fd0);
  font-size:19px;
  font-weight:900;
  box-shadow:0 5px 15px rgba(0,0,0,.35);
}

.btn:active{
  transform:scale(.97);
}

.btn.green{
  background:linear-gradient(135deg,#075c43,#0c9971);
}

.btn.red{
  background:linear-gradient(135deg,#651414,#bb2727);
}

.btn.blue{
  background:linear-gradient(135deg,#123d78,#2679db);
}

/* =========================================================
   START
========================================================= */

#startScreen{
  background:
    radial-gradient(
      circle at center,
      #421478 0,
      #13051f 45%,
      #030006 100%
    );
  text-align:center;
}

.startTitle{
  font-size:clamp(34px,8vw,78px);
  font-weight:1000;
  color:#d39aff;
  text-shadow:0 0 20px #802cff;
  margin-bottom:25px;
}

/* =========================================================
   SETUP
========================================================= */

#setupScreen{
  background:
    linear-gradient(
      135deg,
      #12041c,
      #32104e,
      #09020f
    );
}

.choiceGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:10px;
  margin:15px 0;
}

.choice{
  min-height:58px;
  padding:12px;
  border:2px solid #6c2aa3;
  background:#1b0b29;
  color:#ddd;
  border-radius:12px;
  font-weight:bold;
}

.choice.selected{
  background:#7828c8;
  border-color:#d09aff;
  box-shadow:0 0 15px #8c30df;
  color:#fff;
}

/* =========================================================
   CHARACTER
========================================================= */

#characterScreen{
  background:
    linear-gradient(
      135deg,
      #08030e,
      #28103d,
      #0c0613
    );
}

.characterLayout{
  width:min(1100px,96vw);
  height:min(88vh,700px);
  display:grid;
  grid-template-columns:42% 58%;
  gap:18px;
}

.previewPanel,
.characterListPanel{
  border:2px solid #8537bc;
  border-radius:22px;
  background:rgba(22,8,34,.95);
  padding:18px;
}

.previewPanel{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.characterName{
  color:#d29aff;
  font-size:clamp(20px,4vw,34px);
  font-weight:900;
  margin-bottom:8px;
}

.characterType{
  color:#bbb;
  margin-bottom:10px;
}

.character{
  position:relative;
  width:170px;
  height:310px;
  margin:8px auto 15px;
}

.charHair{
  position:absolute;
  width:100px;
  height:85px;
  left:35px;
  top:12px;
  background:#151515;
  border-radius:50% 50% 42% 42%;
  z-index:4;
}

.charHead{
  position:absolute;
  width:78px;
  height:90px;
  left:46px;
  top:35px;
  background:#f0b78d;
  border-radius:42% 42% 48% 48%;
  z-index:3;
}

.charEye{
  position:absolute;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#111;
  top:73px;
  z-index:5;
}

.eyeL{left:65px}
.eyeR{left:98px}

.charMouth{
  position:absolute;
  width:25px;
  height:7px;
  left:73px;
  top:103px;
  border-bottom:3px solid #521c1c;
  border-radius:50%;
  z-index:5;
}

.charBody{
  position:absolute;
  width:105px;
  height:125px;
  left:32px;
  top:120px;
  background:#376dff;
  border-radius:22px 22px 12px 12px;
  z-index:2;
}

.charArm{
  position:absolute;
  width:27px;
  height:105px;
  top:132px;
  border-radius:18px;
  background:#f0b78d;
  z-index:1;
}

.armL{
  left:12px;
  transform:rotate(8deg);
}

.armR{
  right:12px;
  transform:rotate(-8deg);
}

.charPants{
  position:absolute;
  width:100px;
  height:75px;
  left:35px;
  top:238px;
  background:#222b45;
  border-radius:8px;
  z-index:1;
}

.charShoe{
  position:absolute;
  width:55px;
  height:23px;
  background:#111;
  border-radius:12px;
  top:286px;
  z-index:2;
}

.shoeL{left:27px}
.shoeR{right:27px}

.charAccessory{
  position:absolute;
  z-index:7;
}

.char-glasses .charAccessory{
  width:68px;
  height:20px;
  left:51px;
  top:69px;
  border-top:4px solid #111;
}

.char-cap .charAccessory{
  width:92px;
  height:25px;
  left:39px;
  top:20px;
  background:#333;
  border-radius:50% 50% 10% 10%;
}

.characterList{
  height:calc(100% - 85px);
  overflow-y:auto;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(125px,1fr));
  gap:8px;
}

.charBtn{
  min-height:60px;
  border:1px solid #63298a;
  background:#170b22;
  color:#eee;
  border-radius:11px;
  padding:8px;
  font-weight:bold;
}

.charBtn.selected{
  background:#792cc0;
  border-color:#e0b0ff;
}

/* =========================================================
   MODE / SETTINGS / SHOP
========================================================= */

#modeScreen{
  background:linear-gradient(135deg,#10051a,#35104e);
}

#settingsScreen{
  background:#09020f;
}

.settingRow{
  margin:20px auto;
  max-width:600px;
  padding:15px;
  border-radius:15px;
  background:#180b25;
  border:1px solid #62317f;
}

input[type=range]{
  width:100%;
  accent-color:#a43dff;
}

#shopScreen{
  background:linear-gradient(135deg,#100619,#35144b);
}

.shopCoins{
  color:#ffd45e;
  font-size:22px;
  font-weight:bold;
  margin-bottom:15px;
}

.shopGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
  max-height:60vh;
  overflow:auto;
}

.shopItem{
  background:#190b27;
  border:1px solid #713b91;
  border-radius:15px;
  padding:15px;
}

.shopItem h3{
  color:#cf9aff;
  margin-bottom:7px;
}

.shopItem p{
  color:#bbb;
  margin:4px 0;
}

/* =========================================================
   GAME
========================================================= */

#gameScreen{
  background:#090909;
  align-items:stretch;
  justify-content:stretch;
}

#gameCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

.hud{
  position:absolute;
  left:12px;
  top:10px;
  z-index:20;
  min-width:180px;
  padding:10px;
  border-radius:13px;
  background:rgba(0,0,0,.62);
  border:1px solid rgba(255,255,255,.2);
  pointer-events:none;
}

.hpBar{
  width:180px;
  height:16px;
  border-radius:10px;
  background:#381010;
  overflow:hidden;
  margin:5px 0;
}

.hpFill{
  height:100%;
  width:100%;
  background:#27d66c;
  transition:width .15s;
}

.hudLine{
  font-size:13px;
  margin:3px 0;
}

.pauseBtn{
  position:absolute;
  right:12px;
  top:12px;
  z-index:30;
  padding:10px 16px;
  border-radius:12px;
  border:1px solid #b96cff;
  background:rgba(25,5,40,.85);
  color:white;
  font-weight:bold;
}

.controls{
  position:absolute;
  inset:0;
  z-index:15;
  pointer-events:none;
}

.joystick{
  position:absolute;
  bottom:28px;
  width:145px;
  height:145px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  border:2px solid rgba(255,255,255,.22);
  pointer-events:auto;
  touch-action:none;
}

#moveJoy{left:25px}
#attackJoy{right:25px}

.stick{
  position:absolute;
  width:65px;
  height:65px;
  left:40px;
  top:40px;
  border-radius:50%;
  background:rgba(161,65,255,.75);
  border:2px solid #d4a0ff;
  box-shadow:0 0 15px rgba(145,50,255,.5);
  will-change:transform;
  pointer-events:none;
}

.weaponBtn{
  position:absolute;
  right:195px;
  bottom:50px;
  pointer-events:auto;
  background:#35104f;
  border:1px solid #a652dc;
  color:#fff;
  padding:12px;
  border-radius:12px;
  font-weight:bold;
}

.interactBtn{
  position:absolute;
  right:195px;
  bottom:105px;
  pointer-events:auto;
  background:#113d34;
  border:1px solid #36c5a2;
  color:#fff;
  padding:10px;
  border-radius:12px;
  font-weight:bold;
}

#levelBanner{
  position:absolute;
  left:50%;
  top:15%;
  transform:translateX(-50%);
  z-index:40;
  font-size:clamp(24px,6vw,55px);
  font-weight:900;
  text-align:center;
  color:#e3baff;
  text-shadow:0 0 15px #7928ff;
  opacity:0;
  transition:opacity .4s;
  pointer-events:none;
}

#levelBanner.show{
  opacity:1;
}

/* =========================================================
   PAUSE / VIDEO / RESULT
========================================================= */

#pauseScreen{
  background:rgba(0,0,0,.82);
  z-index:100;
}

.pausePanel{
  width:min(500px,90vw);
  padding:25px;
  background:#180821;
  border:2px solid #8e39c6;
  border-radius:20px;
  text-align:center;
}

#videoScreen{
  background:#050505;
  z-index:500;
  flex-direction:column;
}

.videoBox{
  width:min(850px,90vw);
  height:min(65vh,500px);
  background:#111;
  border:2px solid #8036aa;
  border-radius:18px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

#gameVideo{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

.videoText{
  margin-top:12px;
  font-weight:bold;
  color:#d9b3ff;
  text-align:center;
}

#resultScreen{
  background:radial-gradient(circle,#401040,#080108);
  text-align:center;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px){

  .characterLayout{
    grid-template-columns:38% 62%;
    height:92vh;
  }

  .character{
    transform:scale(.78);
    margin-top:-10px;
    margin-bottom:-25px;
  }

  .characterList{
    grid-template-columns:repeat(2,1fr);
  }

  .previewPanel{
    padding:8px;
  }

  .joystick{
    width:125px;
    height:125px;
    bottom:18px;
  }

  #moveJoy{left:12px}
  #attackJoy{right:12px}

  .stick{
    width:57px;
    height:57px;
    left:32px;
    top:32px;
  }

  .weaponBtn{
    right:145px;
    bottom:28px;
  }

  .interactBtn{
    right:145px;
    bottom:82px;
  }
}

@media(max-height:500px){

  .joystick{
    width:105px;
    height:105px;
  }

  .stick{
    width:50px;
    height:50px;
    left:26px;
    top:26px;
  }

  .weaponBtn{
    bottom:15px;
  }

  .interactBtn{
    bottom:65px;
  }

  .hud{
    transform:scale(.85);
    transform-origin:top left;
  }
}
</style>
</head>

<body>

<!-- =======================================================
     INTRO
======================================================= -->

<section id="intro" class="screen active">
  <div id="introItem" class="introItem">
    <img class="introLogo" src="nihs-logo.png" alt="NIHS">
  </div>
</section>

<!-- START -->

<section id="startScreen" class="screen">
  <div>
    <img class="logo" src="nihs-logo.png" alt="NIHS">

    <div class="startTitle">
      NIHS ZOMBIE<br>
      APOCALYPSE
    </div>

    <button class="btn green" onclick="startGame()">
      SUGDI
    </button>
  </div>
</section>

<!-- HOME -->

<section id="homeScreen" class="screen">

  <div class="mainPanel">

    <img class="logo" src="nihs-logo.png" alt="NIHS">

    <h1>NIHS ZOMBIE APOCALYPSE</h1>

    <button class="btn" onclick="openSetup()">
      DUWA
    </button>

    <button class="btn" onclick="openSettings()">
      MGA SETTING
    </button>

    <button class="btn" onclick="openShop()">
      TINDAHAN
    </button>

  </div>

</section>

<!-- SETUP -->

<section id="setupScreen" class="screen">

  <div class="mainPanel">

    <h1>PAGPILI SA PLAYER</h1>

    <h2>Kinsa ka?</h2>

    <div class="choiceGrid">

      <button class="choice"
        data-group="role"
        data-value="student"
        onclick="selectSetup('role','student')">
        ESTUDYANTE
      </button>

      <button class="choice"
        data-group="role"
        data-value="teacher"
        onclick="selectSetup('role','teacher')">
        MAGTUTUDLO
      </button>

    </div>

    <h2>Grade</h2>

    <div class="choiceGrid" id="gradeChoices">

      <button class="choice"
        data-group="grade"
        data-value="7"
        onclick="selectSetup('grade','7')">
        GRADE 7
      </button>

      <button class="choice"
        data-group="grade"
        data-value="8"
        onclick="selectSetup('grade','8')">
        GRADE 8
      </button>

      <button class="choice"
        data-group="grade"
        data-value="9"
        onclick="selectSetup('grade','9')">
        GRADE 9
      </button>

      <button class="choice"
        data-group="grade"
        data-value="10"
        onclick="selectSetup('grade','10')">
        GRADE 10
      </button>

      <button class="choice"
        data-group="grade"
        data-value="11"
        onclick="selectSetup('grade','11')">
        GRADE 11
      </button>

      <button class="choice"
        data-group="grade"
        data-value="12"
        onclick="selectSetup('grade','12')">
        GRADE 12
      </button>

    </div>

    <h2>Gender</h2>

    <div class="choiceGrid">

      <button class="choice"
        data-group="gender"
        data-value="male"
        onclick="selectSetup('gender','male')">
        LALAKI
      </button>

      <button class="choice"
        data-group="gender"
        data-value="female"
        onclick="selectSetup('gender','female')">
        BABAYE
      </button>

    </div>

    <button class="btn" onclick="openCharacters()">
      PADAYON
    </button>

    <button class="btn red" onclick="showScreen('homeScreen')">
      BALIK
    </button>

  </div>

</section>

<!-- CHARACTER -->

<section id="characterScreen" class="screen">

  <div class="characterLayout">

    <div class="previewPanel">

      <div class="characterName" id="selectedCharacterName">
        PILI UNA
      </div>

      <div class="characterType" id="selectedCharacterType">
        -
      </div>

      <div id="characterPreview" class="character">

        <div class="charHair"></div>
        <div class="charHead"></div>
        <div class="charEye eyeL"></div>
        <div class="charEye eyeR"></div>
        <div class="charMouth"></div>
        <div class="charBody"></div>
        <div class="charArm armL"></div>
        <div class="charArm armR"></div>
        <div class="charPants"></div>
        <div class="charShoe shoeL"></div>
        <div class="charShoe shoeR"></div>
        <div class="charAccessory"></div>

      </div>

      <button class="btn" onclick="openMode()">
        PADAYON
      </button>

      <button class="btn red" onclick="showScreen('setupScreen')">
        BALIK
      </button>

    </div>

    <div class="characterListPanel">

      <h2>PILI UG KARAKTER</h2>

      <div class="characterList" id="characterList"></div>

    </div>

  </div>

</section>

<!-- MODE -->

<section id="modeScreen" class="screen">

  <div class="mainPanel">

    <h1>PILI UG MODE</h1>

    <h2 id="modeCharacterText"></h2>

    <button class="btn green" onclick="chooseMode('human')">
      TAO<br>
      <small>GAMIT UG ARMAS</small>
    </button>

    <button class="btn red" onclick="chooseMode('zombie')">
      ZOMBIE<br>
      <small>BITE LANG</small>
    </button>

    <button class="btn" onclick="showScreen('characterScreen')">
      BALIK
    </button>

  </div>

</section>

<!-- SETTINGS -->

<section id="settingsScreen" class="screen">

  <div class="mainPanel">

    <h1>MGA SETTING</h1>

    <div class="settingRow">

      <h3>MASTER VOLUME</h3>

      <input
        id="volumeSlider"
        type="range"
        min="0"
        max="1"
        step=".01"
        value=".7"
        oninput="changeVolume(this.value)"
      >

    </div>

    <div class="settingRow">

      <button id="musicBtn"
        class="btn"
        onclick="toggleMusic()">
        MUSIC: ON
      </button>

      <button id="sfxBtn"
        class="btn"
        onclick="toggleSfx()">
        SFX: ON
      </button>

      <button id="muteBtn"
        class="btn red"
        onclick="toggleMute()">
        MUTE ALL
      </button>

    </div>

    <button class="btn red" onclick="returnFromSettings()">
      BALIK
    </button>

  </div>

</section>

<!-- SHOP -->

<section id="shopScreen" class="screen">

  <div class="mainPanel">

    <h1>TINDAHAN</h1>

    <div class="shopCoins">
      🪙 COINS:
      <span id="shopCoins">0</span>
    </div>

    <div class="shopGrid" id="shopGrid"></div>

    <button class="btn red" onclick="showScreen('homeScreen')">
      BALIK
    </button>

  </div>

</section>

<!-- GAME -->

<section id="gameScreen" class="screen">

  <canvas id="gameCanvas"></canvas>

  <div class="hud">

    <div class="hudLine">
      ❤️ HP:
      <span id="hpText">100</span>
    </div>

    <div class="hpBar">
      <div class="hpFill" id="hpFill"></div>
    </div>

    <div class="hudLine">
      🏫 ROOM:
      <span id="roomText">1</span>/6
    </div>

    <div class="hudLine">
      🧟 ZOMBIE:
      <span id="enemyText">0</span>
    </div>

    <div class="hudLine">
      ⭐ SCORE:
      <span id="scoreText">0</span>
    </div>

    <div class="hudLine">
      🪙 COINS:

function sfx(type){

  if(
    !settings.sfx ||
    settings.mute
  ){

    return;

  }

  try{

    const AC =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AC){
      return;
    }

    const ac = new AC();

    const o =
      ac.createOscillator();

    const g =
      ac.createGain();

    const map = {

      click:[420,.07,"square"],
      select:[600,.09,"sine"],
      attack:[180,.08,"sawtooth"],
      hit:[90,.1,"square"],
      zombie:[70,.18,"sawtooth"],
      buy:[700,.14,"sine"],
      level:[500,.25,"triangle"],
      victory:[900,.35,"sine"],
      gameover:[110,.5,"sawtooth"],
      bite:[120,.15,"square"]

    };

    const d =
      map[type] ||
      map.click;

    o.frequency.value = d[0];
    o.type = d[2];

    g.gain.setValueAtTime(
      .001,
      ac.currentTime
    );

    g.gain.exponentialRampToValueAtTime(
      .15,
      ac.currentTime+.01
    );

    g.gain.exponentialRampToValueAtTime(
      .001,
      ac.currentTime+d[1]
    );

    o.connect(g);
    g.connect(ac.destination);

    o.start();

    o.stop(
      ac.currentTime+d[1]+.02
    );

  }catch(e){}

}

        name.charCodeAt(i)

  }

  H =
    innerHeight;

  canvas.width =
    W*dpr;

  canvas.height =
    H*dpr;

  canvas.style.width =
    W+"px";

  canvas.style.height =
    H+"px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

}

/* =========================================================
   SAFE PLAYER SPAWN
   IMPORTANT FIX
========================================================= */

function findSafePlayerPosition(){

  const spots = [

    [W/2,H/2],
    [W/2,100],
    [100,H/2],
    [W-100,H/2],
    [100,100],
    [W-100,100],
    [100,H-100],
    [W-100,H-100],
    [W/2,H-100]

  ];

  for(
    const spot of spots
  ){

    if(
      !blocked(
        spot[0],
        spot[1],
        game.player.r
      )
    ){

      return {
        x:spot[0],
        y:spot[1]
      };

    }

  }

  for(
    let i=0;
    i<100;
    i++
  ){

    const x =
      60+
      Math.random()*
      Math.max(
        1,
        W-120
      );

    const y =
      100+
      Math.random()*
      Math.max(
        1,
        H-160
      );

    if(
      !blocked(
        x,
        y,
        game.player.r
      )
    ){

      return {
        x,
        y
      };

    }

  }

  return {
    x:Math.max(
      30,
      W/2
    ),
    y:Math.max(
      90,
      H/2
    )
  };

}

  game.yawaTimer =
    0;

  game.roomCleared =
    false;

  game.transitioning =
    false;

  game.combo =
    0;

  game.videoShowing =
    false;

  game.resultSaved =
    false;

  const equippedIndex =
    weapons.findIndex(
      w =>
        w.id ===
        saveData.equipped
    );

  game.weaponIndex =
    equippedIndex >= 0
    ? equippedIndex
    : 0;

  game.player.inv =
    0;

  game.player.angle =
    0;

  createRoom(
    game.room
  );

  const spawn =
    findSafePlayerPosition();

  game.player.x =
    spawn.x;

  game.player.y =
    spawn.y;

  resetJoysticks();

  showLevelBanner(
    "ROOM 1"
  );

  unlockAudio();

  cancelAnimationFrame(
    animationId
  );

  lastTime =
    performance.now();

  animationId =
    requestAnimationFrame(
      gameLoop
    );

  updateHUD();

}

function restartGame(){

  startActualGame();

}

function addObject(

  y,
  w,
  h,
  type
){

    y,
    w,

function createRoom(room){

  game.objects =
    [];

  const wallColors = [

    null,
    "#382052",
    "#164c48",
    "#34475e",
    "#593c17",
    "#24182d",
    "#431b29"

  ];

  const floorColors = [

    null,
    "#635f72",
    "#4f6963",
    "#59616c",
    "#69543c",
    "#37313e",
    "#492b35"

  ];

  game.roomStyle = {

    wall:wallColors[room],
    floor:floorColors[room]

  };

  if(room === 1){

    for(
      let x=150;
      x<W-120;
      x+=150
    ){

      for(
        let y=150;
        y<H-130;
        y+=115
      ){

        addObject(
          x,
          y,
          90,
          50,
          "desk"
        );

      }

    }

    addObject(
      W*.5,
      90,
      150,
      35,
      "board"
    );

    addObject(
      W*.5,
      145,
      90,
      35,
      "teacher"
    );

  }else if(room === 2){

    for(
      let i=0;
      i<5;
      i++
    ){

      addObject(
        120+i*150,
        150,
        100,
        42,
        "desk"
      );

      addObject(
        170+i*130,
        H-170,
        80,
        45,
        "cabinet"
      );

    }

    addObject(
      W-120,
      H/2,
      45,
      170,
      "board"
    );

  }else if(room === 3){

    for(
      let i=0;
      i<5;
      i++
    ){

      addObject(
        90+i*170,
        H/2-80,
        120,
        35,
        "locker"
      );

      addObject(
        90+i*170,
        H/2+80,
        120,
        35,
        "bench"
      );

    }

    addObject(
      W/2,
      70,
      180,
      30,
      "sign"
    );

  }else if(room === 4){

    addObject(
      W/2,
      95,
      Math.min(
        420,
        W*.6
      ),
      80,
      "stage"
    );

    for(
      let i=0;
      i<4;
      i++
    ){

      addObject(
        120+i*180,
        H-120,
        90,
        40,
        "eventtable"
      );

    }

    addObject(
      80,
      100,
      55,
      150,
      "banner"
    );

    addObject(
      W-80,
      100,
      55,
      150,
      "banner"
    );

  }else if(room === 5){

    for(
      let i=0;
      i<8;
      i++
    ){

      let x,y;
      let tries=0;

      do{

        x =
          80+
          Math.random()*
          Math.max(
            1,
            W-160
          );

        y =
          110+
          Math.random()*
          Math.max(
            1,
            H-230
          );

        tries++;

      }while(
        blocked(
          x,
          y,
          30
        ) &&
        tries<30
      );

      addObject(
        x,
        y,
        70+
        Math.random()*50,
        40,
        "broken"
      );

    }

  }else if(room === 6){

    addObject(
      W/2,
      90,
      Math.min(
        500,
        W*.7
      ),
      65,
      "bossaltar"
    );

    for(
      let i=0;
      i<6;
      i++
    ){

      addObject(
        90+i*150,
        H-120,
        100,
        40,
        "darkdesk"
      );

    }

    /*
      Boss area is decoration only.
      It no longer blocks the player.
    */

  }

  /* BORDER */

  addObject(
    W/2,
    -10,
    W,
    20,
    "wall"
  );

  addObject(
    W/2,
    H+10,
    W,
    20,
    "wall"
  );

  addObject(
    -10,
    H/2,
    20,
    H,
    "wall"
  );

  addObject(
    W+10,
    H/2,
    20,
    H,
    "wall"
  );

  /* ENEMIES */

  const count =
    room === 1 ? 5 :
    room === 2 ? 7 :
    room === 3 ? 8 :
    room === 4 ? 10 :
    room === 5 ? 11 :
    13;

  for(
    let i=0;
    i<count;
    i++
  ){

    if(
      Math.random()<.55
    ){

      spawnEnemy();

    }

  }

  if(
    game.enemies.length === 0
  ){

    spawnEnemy();

  }

}

/* =========================================================
   COLLISION
========================================================= */

function circleRectCollision(
  cx,
  cy,
  r,
  o
){

  const left =
    o.x-o.w/2;

  const right =
    o.x+o.w/2;

  const top =
    o.y-o.h/2;

  const bottom =
    o.y+o.h/2;

  const x =
    Math.max(
      left,
      Math.min(
        cx,
        right
      )
    );

  const y =
    Math.max(
      top,
      Math.min(
        cy,
        bottom
      )
    );

  const dx =
    cx-x;

  const dy =
    cy-y;

  return (
    dx*dx+
    dy*dy
  ) <
  r*r;

}

function blocked(
  x,
  y,
  r
){

  /*
    Boundary collision.
  */

  if(
    x-r < 0 ||
    x+r > W ||
    y-r < 65 ||
    y+r > H
  ){

    return true;

  }

  for(
    const o of game.objects
  ){

    /*
      Boss area is visual only.
    */

    if(
      o.type==="bossarea"
    ){

      continue;

    }

    if(
      o.type==="wall"
    ){

      continue;

    }

    if(
      circleRectCollision(
        x,
        y,
        r,
        o
      )
    ){

      return true;

    }

  }

  return false;

}

/* =========================================================
   ENEMIES
========================================================= */

function findSafeEnemyPosition(){

  for(
    let attempt=0;
    attempt<70;
    attempt++
  ){

    const side =
      Math.floor(
        Math.random()*4
      );

    let x,y;

    if(side===0){

      x =
        35+
        Math.random()*
        Math.max(
          1,
          W-70
        );

      y=90;

    }else if(side===1){

      x=W-35;

      y =
        90+
        Math.random()*
        Math.max(
          1,
          H-120
        );

    }else if(side===2){

      x =
        35+
        Math.random()*
        Math.max(
          1,
          W-70
        );

      y=H-35;

    }else{

      x=35;

      y =
        90+
        Math.random()*
        Math.max(
          1,
          H-120
        );

    }

    if(
      !blocked(
        x,
        y,
        20
      )
    ){

      return {
        x,
        y
      };

    }

  }

  return {
    x:40,
    y:90
  };

}

function spawnEnemy(){

  if(
    !game.running ||
    game.paused ||
    game.transitioning ||
    game.roomCleared
  ){

    return;

  }

  const pos =
    findSafeEnemyPosition();

  const r =
    Math.random();

  let type =
    "normal";

  if(
    game.room>=2 &&
    r<.25
  ){

    type="fast";

  }

  if(
    game.room>=3 &&
    r<.17
  ){

    type="strong";

  }

  if(
    game.room===6 &&
    Math.random()<.13
  ){

    type="boss";

  }

  const data = {

    normal:{
      hp:30+game.room*7,
      speed:55+game.room*5,
      damage:5,
      r:19,
      color:"#68ad5c"
    },

    fast:{
      hp:22+game.room*6,
      speed:105+game.room*7,
      damage:8,
      r:17,
      color:"#d0a335"
    },

    strong:{
      hp:80+game.room*12,
      speed:40+game.room*3,
      damage:10,
      r:25,
      color:"#8048a8"
    },

    boss:{
      hp:450,
      speed:38,
      damage:15,
      r:43,
      color:"#a12639"
    }

  }[type];

  game.enemies.push({

    x:pos.x,
    y:pos.y,

    type:type,

    hp:data.hp,
    maxHp:data.hp,

    speed:data.speed,
    damage:data.damage,

    r:data.r,
    color:data.color,

    attack:0,
    hitFlash:0

  });

}

function drawEnemy(e){

  ctx.save();

  ctx.translate(
    e.x,
    e.y
  );

  if(e.hitFlash>0){

    ctx.globalAlpha=.65;

  }

  ctx.fillStyle =
    e.color;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    e.r,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle =
    "#a9d38b";

  ctx.beginPath();

  ctx.arc(
    0,
    -e.r*.65,
    e.r*.7,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle =
    "#111";

  ctx.beginPath();

  ctx.arc(
    -e.r*.25,
    -e.r*.72,
    3,
    0,
    Math.PI*2
  );

  ctx.arc(
    e.r*.25,
    -e.r*.72,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.strokeStyle =
    "#222";

  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.moveTo(
    -e.r*.25,
    -e.r*.42
  );

  ctx.lineTo(
    e.r*.25,
    -e.r*.42
  );

  ctx.stroke();

  if(
    e.type==="boss"
  ){

    ctx.fillStyle =
      "#ffcc38";

    ctx.font =
      "bold 12px Arial";

    ctx.textAlign =
      "center";

    ctx.fillText(
      "BOSS",
      0,
      -e.r-25
    );

  }

  ctx.restore();

  const bw =
    e.r*2.2;

  ctx.fillStyle =
    "#401010";

  ctx.fillRect(
    e.x-bw/2,
    e.y-e.r-12,
    bw,
    5
  );

  ctx.fillStyle =
    "#4ce879";

  ctx.fillRect(
    e.x-bw/2,
    e.y-e.r-12,
    bw*
    Math.max(
      0,
      e.hp/e.maxHp
    ),
    5
  );

}

function particle(

  y,
  text,
  life=.5
){

  game.damageTexts.push({

    x,
    y,
    text,
    life,
    max:life

function drawParticles(dt){

  game.damageTexts.forEach(
    t=>{

      t.life -=
        dt;

      t.y -=
        25*dt;

      ctx.globalAlpha =
        Math.max(
          0,
          t.life/t.max
        );

      ctx.fillStyle =
        "#fff";

      ctx.font =
        "bold 16px Arial";

      ctx.textAlign =
        "center";

      ctx.fillText(
        t.text,
        t.x,
        t.y
      );

    }
  );

  ctx.globalAlpha =
    1;

  game.damageTexts =
    game.damageTexts.filter(
      t=>t.life>0
    );

}

/* =========================================================
   ATTACK
========================================================= */

function attack(){

  if(
    !game.running ||
    game.paused ||
    game.transitioning ||
    game.roomCleared
  ){

    return;

  }

  if(
    selectedMode==="zombie"
  ){

    zombieAttack();

    return;

  }

  const w =
    weapons[
      game.weaponIndex
    ];

  if(
    game.attackTimer>0
  ){

    return;

  }

  game.attackTimer =
    w.speed;

  sfx("attack");

  const p =
    game.player;

  for(
    let i=0;
    i<game.enemies.length;
    i++
  ){

    const e =
      game.enemies[i];

    const dx =
      e.x-p.x;

    const dy =
      e.y-p.y;

    const dist =
      Math.hypot(
        dx,
        dy
      );

    if(
      dist>w.range+e.r
    ){

      continue;

    }

    const angle =
      Math.atan2(
        dy,
        dx
      );

    const diff =
      Math.atan2(
        Math.sin(
          angle-p.angle
        ),
        Math.cos(
          angle-p.angle
        )
      );

    if(
      Math.abs(diff)>.9
    ){

      continue;

    }

    e.hp -=
      w.damage;

    e.hitFlash =
      .15;

    const len =
      Math.hypot(
        dx,
        dy
      )||1;

    const nx =
      e.x+
      dx/len*
      w.knock;

    const ny =
      e.y+
      dy/len*
      w.knock;

    if(
      !blocked(
        nx,
        e.y,
        e.r
      )
    ){

      e.x =
        nx;

    }

    if(
      !blocked(
        e.x,
        ny,
        e.r
      )
    ){

      e.y =
        ny;

    }

    particle(
      e.x,
      e.y,
      "-"+
      w.damage
    );

    sfx("hit");

    if(
      e.hp<=0
    ){

      game.score +=
        10*
        (
          game.room+
          (
            e.type==="boss"
            ? 10
            : 1
          )
        );

      game.coins +=
        e.type==="boss"
        ? 30
        : 3;

      if(
        e.type==="boss"
      ){

        game.score +=
          500;

      }

      game.combo++;

      game.enemies.splice(
        i,
        1
      );

      i--;

    }

  }

}

function zombieAttack(){

  if(
    game.attackTimer>0
  ){

    return;

  }

  game.attackTimer =
    .65;

  sfx("bite");

  const p =
    game.player;

  let nearest =
    null;

  let nd =
    75;

  for(
    const e of game.enemies
  ){

    const d =
      Math.hypot(
        e.x-p.x,
        e.y-p.y
      );

    if(d<nd){

      nearest=e;
      nd=d;

    }

  }

  if(nearest){

    nearest.hp -=
      35;

    particle(
      nearest.x,
      nearest.y,
      "BITE"
    );

    sfx("hit");

    if(
      nearest.hp<=0
    ){

      const index =
        game.enemies.indexOf(
          nearest
        );

      if(index>=0){

        game.enemies.splice(
          index,
          1
        );

      }

      game.score +=
        25;

      game.coins +=
        5;

    }

  }

}

/* =========================================================
   PLAYER MOVEMENT
   IMPORTANT FIX
========================================================= */

const joystick = {

  moveX:0,
  moveY:0,

  attackX:0,
  attackY:0

};

/*
  Keyboard state is now completely
  separate from mobile joystick.
*/

const keys = {};

function getKeyboardMovement(){

  let x=0;
  let y=0;

  if(
    keys["w"] ||
    keys["arrowup"]
  ){

    y--;

  }

  if(
    keys["s"] ||
    keys["arrowdown"]
  ){

    y++;

  }

  if(
    keys["a"] ||
    keys["arrowleft"]
  ){

    x--;

  }

  if(
    keys["d"] ||
    keys["arrowright"]
  ){

    x++;

  }

  if(
    x===0 &&
    y===0
  ){

    return {
      x:0,
      y:0
    };

  }

  const len =
    Math.hypot(
      x,
      y
    )||1;

  return {
    x:x/len,
    y:y/len
  };

}

function updatePlayer(dt){

  /*
    MOBILE JOYSTICK HAS PRIORITY.
    If it is not being used,
    keyboard movement is checked.
  */

  let vx =
    joystick.moveX;

  let vy =
    joystick.moveY;

  const joyLength =
    Math.hypot(
      vx,
      vy
    );

  if(
    joyLength<0.05
  ){

    const kb =
      getKeyboardMovement();

    vx =
      kb.x;

    vy =
      kb.y;

  }

  const len =
    Math.hypot(
      vx,
      vy
    );

  if(
    len>0.05
  ){

    if(len>1){

      vx/=len;
      vy/=len;

    }

    const speed =
      game.player.speed;

    const nx =
      game.player.x+
      vx*speed*dt;

    const ny =
      game.player.y+
      vy*speed*dt;

    /*
      Check X and Y separately.
      This allows sliding beside furniture.
    */

    if(
      !blocked(
        nx,
        game.player.y,
        game.player.r
      )
    ){

      game.player.x =
        nx;

    }

    if(
      !blocked(
        game.player.x,
        ny,
        game.player.r
      )
    ){

      game.player.y =
        ny;

    }

    game.player.angle =
      Math.atan2(
        vy,
        vx
      );

  }

  /*
    ATTACK JOYSTICK
  */

  if(
    Math.abs(joystick.attackX)>.05 ||
    Math.abs(joystick.attackY)>.05
  ){

    const ax =
      joystick.attackX;

    const ay =
      joystick.attackY;

    game.player.angle =
      Math.atan2(
        ay,
        ax
      );

    attack();

  }

}

/* =========================================================
   JOYSTICK
   ROBUST TOUCH + POINTER SUPPORT
========================================================= */

function resetJoysticks(){

  joystick.moveX=0;
  joystick.moveY=0;
  joystick.attackX=0;
  joystick.attackY=0;

  document
    .querySelectorAll(
      ".stick"
    )
    .forEach(
      s=>{
        s.style.transform =
          "translate(0,0)";
      }
    );

}

function setupJoystick(
  id,
  type
){

  const el =
    $(id);

  const stick =
    el.querySelector(
      ".stick"
    );

  let active =
    false;

  let pointerId =
    null;

  function setValue(
    clientX,
    clientY
  ){

    const r =
      el.getBoundingClientRect();

    let x =
      clientX-
      (
        r.left+
        r.width/2
      );

    let y =
      clientY-
      (
        r.top+
        r.height/2
      );

    const max =
      r.width*.34;

    const distance =
      Math.hypot(
        x,
        y
      );

    if(
      distance>max
    ){

      x =
        x/distance*
        max;

      y =
        y/distance*
        max;

    }

    const nx =
      x/max;

    const ny =
      y/max;

    stick.style.transform =
      `translate(${x}px,${y}px)`;

    if(
      type==="move"
    ){

      joystick.moveX =
        nx;

      joystick.moveY =
        ny;

    }else{

      joystick.attackX =
        nx;

      joystick.attackY =
        ny;

    }

  }

  function release(){

    active =
      false;

    pointerId =
      null;

    stick.style.transform =
      "translate(0,0)";

    if(
      type==="move"
    ){

      joystick.moveX=0;
      joystick.moveY=0;

    }else{

      joystick.attackX=0;
      joystick.attackY=0;

    }

  }

  /*
    POINTER EVENTS
  */

  el.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();

      if(
        active
      ){

        return;

      }

      active =
        true;

      pointerId =
        e.pointerId;

      try{

        el.setPointerCapture(
          e.pointerId
        );

      }catch(err){}

      setValue(
        e.clientX,
        e.clientY
      );

    },
    {
      passive:false
    }
  );

  el.addEventListener(
    "pointermove",
    e=>{

      if(
        !active ||
        e.pointerId!==pointerId
      ){

        return;

      }

      e.preventDefault();

      setValue(
        e.clientX,
        e.clientY
      );

    },
    {
      passive:false
    }
  );

  el.addEventListener(
    "pointerup",
    e=>{

      if(
        e.pointerId===pointerId
      ){

        e.preventDefault();

        release();

      }

    },
    {
      passive:false
    }
  );

  el.addEventListener(
    "pointercancel",
    e=>{

      if(
        e.pointerId===pointerId
      ){

        release();

      }

    }
  );

  /*
    TOUCH FALLBACK
    This is important for phones
    where pointer events behave badly.
  */

  el.addEventListener(
    "touchstart",
    e=>{

      e.preventDefault();

      const t =
        e.changedTouches[0];

      if(!t){
        return;
      }

      active =
        true;

      setValue(
        t.clientX,
        t.clientY
      );

    },
    {
      passive:false
    }
  );

  el.addEventListener(
    "touchmove",
    e=>{

      if(!active){
        return;
      }

      e.preventDefault();

      const t =
        e.changedTouches[0];

      if(!t){
        return;
      }

      setValue(
        t.clientX,
        t.clientY
      );

    },
    {
      passive:false
    }
  );

  el.addEventListener(
    "touchend",
    e=>{

      e.preventDefault();

      release();

    },
    {
      passive:false
    }
  );

  el.addEventListener(
    "touchcancel",
    release
  );

}

setupJoystick(
  "moveJoy",
  "move"
);

setupJoystick(
  "attackJoy",
  "attack"
);

/* =========================================================
   ENEMY UPDATE
========================================================= */

function updateEnemies(dt){

  for(
    const e of game.enemies
  ){

    if(!game.running){
      break;
    }

    e.attack =
      Math.max(
        0,
        e.attack-dt
      );

    e.hitFlash =
      Math.max(
        0,
        e.hitFlash-dt
      );

    const dx =
      game.player.x-e.x;

    const dy =
      game.player.y-e.y;

    const dist =
      Math.hypot(
        dx,
        dy
      )||1;

    if(
      dist>
      game.player.r+
      e.r+
      5
    ){

      const nx =
        e.x+
        dx/dist*
        e.speed*
        dt;

      const ny =
        e.y+
        dy/dist*
        e.speed*
        dt;

      if(
        !blocked(
          nx,
          e.y,
          e.r
        )
      ){

        e.x =
          nx;

      }

      if(
        !blocked(
          e.x,
          ny,
          e.r
        )
      ){

        e.y =
          ny;

      }

    }else{

      enemyAttack(
        e
      );

    }

  }

}

/* =========================================================
   ROOM PROGRESSION
========================================================= */

function checkRoom(){

  if(
    game.transitioning ||
    game.videoShowing
  ){

    return;

  }

  if(
    game.room===6 &&
    game.enemies.length===0 &&
    !game.roomCleared
  ){

    game.roomCleared =
      true;

    game.transitioning =
      true;

    endGame(
      true
    );

    return;

  }

  if(
    game.enemies.length===0 &&
    !game.roomCleared
  ){

    game.roomCleared =
      true;

    game.transitioning =
      true;

    if(
      game.room===4
    ){

      showVideo(
        "level4.mp4",
        "MAAYONG PAGKAPUS SA ROOM 4!",
        ()=>{
          nextRoom();
        },
        0
      );

    }else{

      setTimeout(
        ()=>{
          nextRoom();
        },
        1200
      );

    }

  }

}

function nextRoom(){

  if(
    game.room>=6
  ){

    endGame(
      true
    );

    return;

  }

  game.room++;

  game.roomCleared =
    false;

  game.transitioning =
    false;

  game.paused =
    false;

  game.videoShowing =
    false;

  game.spawnTimer =
    0;

  game.yawaTimer =
    0;

  createRoom(
    game.room
  );

  const spawn =
    findSafePlayerPosition();

  game.player.x =
    spawn.x;

  game.player.y =
    spawn.y;

  game.player.inv =
    .5;

  showScreen(
    "gameScreen"
  );

  showLevelBanner(
    "ROOM "+
    game.room
  );

  sfx("level");

  lastTime =
    performance.now();

  unlockAudio();

}

  );

}

/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(now){

  if(
    !game.running
  ){

    return;

  }

  animationId =
    requestAnimationFrame(
      gameLoop
    );

  let dt =
    (
      now-lastTime
    )/1000;

  lastTime =
    now;

  dt =
    Math.min(
      dt,
      .05
    );

  if(
    game.paused
  ){

    return;

  }

  update(dt);

  draw(dt);

}

function update(dt){

  game.attackTimer =
    Math.max(
      0,
      game.attackTimer-dt
    );

  game.player.inv =
    Math.max(
      0,
      game.player.inv-dt
    );

  updatePlayer(
    dt
  );

  updateEnemies(
    dt
  );

  if(
    !game.running
  ){

    return;

  }

  updateHealing(
    dt
  );

  updateYawa(
    dt
  );

  if(
    !game.roomCleared &&
    !game.transitioning
  ){

    game.spawnTimer +=
      dt;

    const target =
      game.room<=2
      ? 1.3
      : game.room<=4
      ? 1
      : .8;

    if(
      game.enemies.length<
      4+game.room &&
      game.spawnTimer>
      target
    ){

      game.spawnTimer =
        0;

      spawnEnemy();

    }

  }

  checkRoom();

  updateHUD();

}

function draw(dt){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  drawRoom();

  game.enemies.forEach(
    drawEnemy
  );

  drawPlayer();

  drawParticles(
    dt
  );

}

/* =========================================================
   WEAPON
========================================================= */

function switchWeapon(){

  if(
    selectedMode==="zombie"
  ){

    return;

  }

  const owned =
    weapons.filter(
      w =>
        saveData.owned.includes(
          w.id
        )
    );

  if(!owned.length){
    return;
  }

  let current =
    owned.findIndex(
      w =>
        w.id===
        weapons[
          game.weaponIndex
        ].id
    );

  if(current<0){
    current=0;
  }

  current =
    (
      current+1
    )%owned.length;

  const next =
    owned[current];

  game.weaponIndex =
    weapons.findIndex(
      w =>
        w.id===
        next.id
    );

  sfx("select");

  updateHUD();

}

  sfx("click");

  if(
    game.roomCleared &&
    !game.transitioning
  ){

    checkRoom();

  }

}

/* =========================================================
   PAUSE
========================================================= */

function pauseGame(){

  if(
    !game.running ||
    game.transitioning ||
    game.videoShowing
  ){

    return;

  }

  game.paused =
    true;

  $("yawa").pause();
  $("music").pause();

  resetJoysticks();

  showScreen(
    "pauseScreen"
  );

}

function resumeGame(){

  if(
    !game.running
  ){

    return;

  }

  game.paused =
    false;

  showScreen(
    "gameScreen"
  );

  lastTime =
    performance.now();

  unlockAudio();

}

function exitGame(){

  if(
    !game.running
  ){

    showScreen(
      "homeScreen"
    );

    return;

  }

  game.running =
    false;

  game.paused =
    false;

  game.transitioning =
    false;

  game.videoShowing =
    false;

  cancelAnimationFrame(
    animationId
  );

  stopGameplayAudio();

  saveData.coins +=
    game.coins;

  if(
    game.score>
    saveData.bestScore
  ){

    saveData.bestScore =
      game.score;

  }

  save();

  game.resultSaved =
    true;

  resetJoysticks();

  showScreen(
    "homeScreen"
  );

}

/* =========================================================
   VIDEO SYSTEM
   IMPORTANT FIX:
   GAME OVER = 30 SECONDS
========================================================= */

function showVideo(
  file,
  text,
  callback,
  minimumDuration=0
){

  if(
    game.videoShowing
  ){

    return;

  }

  game.videoShowing =
    true;

  game.paused =
    true;

  $("yawa").pause();
  $("music").pause();

  const video =
    $("gameVideo");

  $("videoText")
    .textContent =
      text;

  /*
    Reset video completely.
  */

  video.pause();

  video.removeAttribute(
    "src"
  );

  video.load();

  video.src =
    file;

  video.currentTime =
    0;

  showScreen(
    "videoScreen"
  );

  let finished =
    false;

  let ended =
    false;

  let started =
    false;

  const startTime =
    performance.now();

  let fallbackTimer =
    null;

  function cleanup(){

    video.removeEventListener(
      "ended",
      onEnded
    );

    video.removeEventListener(
      "error",
      onError
    );

    video.removeEventListener(
      "loadeddata",
      onLoaded
    );

    if(
      fallbackTimer!==null
    ){

      clearTimeout(
        fallbackTimer
      );

      fallbackTimer =
        null;

    }

  }

  function finish(){

    if(
      finished
    ){

      return;

    }

    /*
      If a minimum duration is required,
      NEVER finish before that duration.
    */

    const elapsed =
      performance.now()-
      startTime;

    if(
      minimumDuration>0 &&
      elapsed<minimumDuration
    ){

      setTimeout(
        finish,
        Math.max(
          50,
          minimumDuration-elapsed
        )
      );

      return;

    }

    /*
      Normal video waits for ended.
      If there is an error, minimum duration
      can still protect game-over.
    */

    if(
      !ended &&
      !minimumDuration
    ){

      return;

    }

    finished =
      true;

    cleanup();

    video.pause();

    video.currentTime =
      0;

    game.videoShowing =
      false;

    if(callback){
      callback();
    }

  }

  function onEnded(){

    ended =
      true;

    finish();

  }

  function onError(){

    /*
      For gameover.mp4, stay on video screen
      for the full 30 seconds even if browser
      reports an error.
    */

    if(
      minimumDuration>0
    ){

      setTimeout(
        finish,
        Math.max(
          100,
          minimumDuration-
          (
            performance.now()-
            startTime
          )
        )
      );

    }else{

      /*
        Other videos can safely continue
        if their file is missing.
      */

      ended =
        true;

      finish();

    }

  }

  function onLoaded(){

    started =
      true;

  }

  video.addEventListener(
    "ended",
    onEnded
  );

  video.addEventListener(
    "error",
    onError
  );

  video.addEventListener(
    "loadeddata",
    onLoaded
  );

  /*
    IMPORTANT:
    Game Over has a full 30-second protection.
    It cannot be cut by the old 5/8-second timer.
  */

  if(
    minimumDuration>0
  ){

    fallbackTimer =
      setTimeout(
        ()=>{
          ended =
            true;
          finish();
        },
        minimumDuration
      );

  }else{

    /*
      Normal videos get a longer fallback,
      but the ended event normally controls them.
    */

    fallbackTimer =
      setTimeout(
        ()=>{
          if(
            !finished &&
            !started
          ){

            ended =
              true;

            finish();

          }
        },
        10000
      );

  }

  /*
    Try to start playback.
    If browser blocks autoplay, the screen
    still remains visible.
  */

  const promise =
    video.play();

  if(
    promise &&
    typeof promise.catch===
    "function"
  ){

    promise.catch(
      ()=>{

        /*
          DO NOT call finish here.
          This is the critical fix.

          Game Over stays for 30 seconds.
        */

        if(
          minimumDuration>0
        ){

          return;

        }

        /*
          For normal videos, if autoplay fails,
          give the screen enough time to continue.
        */

        setTimeout(
          ()=>{
            if(!finished){

              ended =
                true;

              finish();

            }
          },
          6000
        );

      }
    );

  }

}

/* =========================================================
   GAME END
========================================================= */

function endGame(win){

  if(
    !game.running &&
    !game.videoShowing
  ){

    return;

  }

  game.running =
    false;

  game.paused =
    false;

  game.transitioning =
    true;

  cancelAnimationFrame(
    animationId
  );

  stopGameplayAudio();

  resetJoysticks();

  /*
    SAVE ONLY ONCE
  */

  if(
    !game.resultSaved
  ){

    saveData.coins +=
      game.coins;

    if(
      game.score>
      saveData.bestScore
    ){

      saveData.bestScore =
        game.score;

    }

    save();

    game.resultSaved =
      true;

  }

  if(win){

    showVideo(
      "victory.mp4",
      "DAOG KA!",
      ()=>{

        $("resultTitle")
          .textContent =
            "DAOG!";

        $("resultText")
          .innerHTML =
            "NABUNTAG NIMO ANG 6 KA ROOM!<br><br>"+
            "SCORE: "+
            game.score+
            "<br>COINS: "+
            game.coins+
            "<br>BEST SCORE: "+
            saveData.bestScore;

        sfx(
          "victory"
        );

        game.transitioning =
          false;

        showScreen(
          "resultScreen"
        );

      },
      0
    );

  }else{

    /*
      FULL 30 SECOND GAME OVER VIDEO.
    */

    showVideo(
      "gameover.mp4",
      "GAME OVER...",
      ()=>{

        $("resultTitle")
          .textContent =
            "GAME OVER";

        $("resultText")
          .innerHTML =
            "NAPILDI KA SA ZOMBIE APOCALYPSE.<br><br>"+
            "SCORE: "+
            game.score+
            "<br>COINS: "+
            game.coins+
            "<br>BEST SCORE: "+
            saveData.bestScore;

        sfx(
          "gameover"
        );

        game.transitioning =
          false;

        showScreen(
          "resultScreen"
        );

      },
      30000
    );

  }

}

/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
  "keydown",
  e=>{

    const key =
      e.key.toLowerCase();

    keys[key] =
      true;

    if(
      e.key===" "
    ){

      e.preventDefault();

      attack();

    }

    if(
      key==="e"
    ){

      switchWeapon();

    }

    if(
      e.key==="Escape"
    ){

      if(
        game.running &&
        !game.paused
      ){

        pauseGame();

      }

    }

  }
);

window.addEventListener(
  "keyup",
  e=>{

    keys[
      e.key.toLowerCase()
    ] =
      false;

  }
);

/*
  Prevent stuck keyboard keys
  when browser loses focus.
*/

window.addEventListener(
  "blur",
  ()=>{

    for(
      const k in keys
    ){

      keys[k]=false;

    }

    resetJoysticks();

  }
);

/* =========================================================
   PREVENT SCROLL / ZOOM
========================================================= */

document.addEventListener(
  "touchmove",
  e=>{

    if(
      e.target.closest(
        ".joystick"
      ) ||
      e.target.closest(
        "#gameCanvas"
      )
    ){

      e.preventDefault();

    }

  },
  {
    passive:false
  }
);

document.addEventListener(
  "contextmenu",
  e=>{
    e.preventDefault();
  }
);

/* =========================================================
   DEFAULTS
========================================================= */

$("music").volume =
  settings.volume;

$("yawa").volume =
  settings.volume;

updateSettingButtons();

renderShop();

resizeCanvas();

</script>
